version: "v1"
settings:
  mode: "audit"
  log_level: "info"
  log_file: "/var/log/outbound/outbound.log"
  log_reverse_dns: true
  dns_refresh_interval: "30s"
  max_ip_entries: 1024
  cover_all_udp: true        # Allow your DNS resolver at UDP 53 before enforcing.
allowlist:
  domains:
    - "metadata.google.internal" # Exact: GCE may resolve this from /etc/hosts.
    - "*.ubuntu.com"          # Ubuntu archives and ESM.
    - "*.canonical.com"       # Ubuntu Pro and Livepatch.
    - "*.snapcraft.io"        # Snap API.
    - "*.snapcraftcontent.com" # Snap content.
    - "*.google.com"          # Google package and download hosts.
    - "*.googleapis.com"      # Google Cloud APIs.
    - "*.amazonaws.com"       # AWS STS, S3, and regional/bucket hosts.
    - domain: "*.example.com"  # Documentation-only custom service.
      ports: [1138, 2218]
  cidrs:
    - cidr: "192.0.2.10/32" # Documentation-only SSH destination.
      ports: [443, 8080, 22]
    - cidr: "192.0.2.20/32" # Documentation-only application destination.
      ports: [3000]
    - "2001:db8::/32"       # Documentation-only IPv6 range; any port.
